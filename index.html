<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>System Diagnostic</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
background:#000;
color:#00ff66;
font-family:"Courier New",monospace;
overflow:hidden;
}

#start{
position:fixed;
inset:0;
z-index:100;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#000;
text-align:center;
}

#start h1{
font-size:clamp(28px,8vw,60px);
letter-spacing:5px;
text-shadow:0 0 20px #00ff66;
}

#start small{
opacity:.55;
margin:18px;
}

button{
border:1px solid #00ff66;
background:#001b09;
color:#00ff66;
padding:15px 28px;
font:700 16px monospace;
box-shadow:0 0 20px #00ff6644;
cursor:pointer;
}

#app{
display:none;
width:100vw;
height:100vh;
padding:12px;

background:
radial-gradient(
circle at 50% 45%,
#073014 0%,
#020805 35%,
#000 75%
);
}

.top{
height:42px;
border-bottom:1px solid #00ff6644;

display:flex;
justify-content:space-between;
align-items:center;

font-size:12px;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
display:inline-block;

background:#00ff66;
box-shadow:0 0 10px #00ff66;

margin-right:7px;
}

#terminal{
height:calc(100vh - 70px);
overflow:hidden;
padding:12px 4px;
}

.line{
font-size:clamp(11px,2.8vw,15px);
line-height:1.55;

white-space:nowrap;
overflow:hidden;

text-shadow:0 0 6px #00ff66;
}

.dim{
opacity:.55;
}

.blue{
color:#00c8ff;
text-shadow:0 0 7px #00c8ff;
}

.yellow{
color:#ffe600;
text-shadow:0 0 7px #ffe600;
}

.red{
color:#ff3030;
text-shadow:0 0 9px red;
}

.barbox{
width:min(650px,95vw);
height:17px;

border:1px solid #00ff66;

margin:7px 0 12px;

box-shadow:0 0 12px #00ff6633;
}

.bar{
width:0;
height:100%;

background:#00ff66;

box-shadow:0 0 14px #00ff66;

transition:width .18s linear;
}

#warning{
display:none;

position:fixed;
inset:0;

z-index:50;

background:rgba(50,0,0,.97);

align-items:center;
justify-content:center;
flex-direction:column;

text-align:center;

color:#ff2222;

animation:flash .18s infinite alternate;
}

#warning h1{
font:900 clamp(38px,12vw,100px) Arial;

margin:12px;

text-shadow:0 0 30px red;
}

#warning div{
font-size:clamp(13px,4vw,22px);
}

#count{
font:bold 80px Arial;
margin-top:15px;
}

#prank{
display:none;

position:fixed;
inset:0;

z-index:200;

background:#000;

align-items:center;
justify-content:center;
flex-direction:column;

text-align:center;
}

#prank img{
position:absolute;
inset:0;

width:100%;
height:100%;

object-fit:cover;

filter:brightness(.72);
}

.overlay{
position:absolute;
inset:0;

background:rgba(0,0,0,.30);
}

.reveal{
position:relative;
z-index:2;

text-align:center;
}

.reveal h1{
margin:0;

font:900 clamp(42px,13vw,110px) Arial;

color:#fff;

text-shadow:
0 0 18px #000,
0 0 35px #00ff66;

animation:pop .7s ease-out;
}

.reveal p{
color:#fff;

font:700 18px Arial;

text-shadow:0 2px 8px #000;
}

#again{
margin-top:10px;
}

.glitch{
animation:shake .07s infinite;
}

.scan{
position:fixed;
inset:0;

pointer-events:none;

z-index:300;

background:
repeating-linear-gradient(
0deg,
rgba(0,255,80,.025) 0,
rgba(0,255,80,.025) 1px,
transparent 1px,
transparent 4px
);
}

@keyframes flash{
from{
opacity:.7;
}
to{
opacity:1;
}
}

@keyframes shake{

0%{
transform:translate(0);
}

25%{
transform:translate(5px,-2px);
}

50%{
transform:translate(-5px,2px);
}

75%{
transform:translate(2px,4px);
}

100%{
transform:translate(0);
}

}

@keyframes pop{

0%{
transform:scale(.05);
opacity:0;
}

65%{
transform:scale(1.12);
}

100%{
transform:scale(1);
opacity:1;
}

}

</style>
</head>

<body>


<!-- START SCREEN -->

<div id="start">

<h1>SYSTEM DIAGNOSTIC</h1>

<small>
SECURE TERMINAL • INITIALIZATION REQUIRED
</small>

<button onclick="start()">
INITIALIZE
</button>

</div>


<!-- TERMINAL -->

<div id="app">

<div class="top">

<span>
<i class="dot"></i>
SECURE TERMINAL
</span>

<span id="clock">
00:00
</span>

</div>

<div id="terminal"></div>

</div>


<!-- FINAL ALERT -->

<div id="warning">

<div>
⚠ SYSTEM SECURITY EVENT ⚠
</div>

<h1>
CRITICAL
</h1>

<div>
FINAL VERIFICATION REQUIRED
</div>

<div id="count">
5
</div>

</div>


<!-- PRANK REVEAL -->

<div id="prank">

<!-- Put your uploaded image in the same folder as this HTML
     and rename it to prank.jpg -->

<img src="prank.jpg">

<div class="overlay"></div>

<div class="reveal">

<h1>
😂 PRANK HO GYA
</h1>

<p>
Relax 😎 — kuch hack nahi hua.
</p>

<button id="again" onclick="location.reload()">
RUN AGAIN
</button>

</div>

</div>


<div class="scan"></div>


<script>

const terminal =
document.getElementById("terminal");


/*
VARIABLE TIMING

Har dialogue ka wait alag hai.
Kuch fast,
kuch slow,
kuch ke beech long silence.
*/

const scenes=[

["Initializing secure runtime...","",2200],

["Loading diagnostic modules...","dim",3100],

["Preparing secure session...","",1400],

["Session initialized.","blue",600],


/* QUICK BURST */

["Checking environment...","",450],

["Reading system interfaces...","",500],

["Interface response: WAITING","yellow",3000],


/* LONG SILENCE */

["PAUSE", "pause",3200],


["Re-attempting interface check...","",900],

["Response received.","blue",2500],


/* DEEP SCAN */

["Beginning deep diagnostic...","yellow",1200],

["DEEP SCAN","progress",6500],


/* RAPID LOGS */

["Environment scan started.","",350],

["Reading runtime...","",350],

["Checking permissions...","",400],

["Checking security layer...","",500],

["Analyzing response...","",900],


["PAUSE","pause",2500],


["Unexpected response detected.","yellow",3300],


/* SECOND SCAN */

["Running secondary verification...","",1100],

["SECURITY VERIFICATION","progress",7200],


["Verification incomplete.","yellow",1900],

["Attempting fallback protocol...","",2900],

["Fallback protocol accepted.","blue",1100],


/* FINGERPRINT */

["Generating diagnostic fingerprint...","",1800],

["Fingerprint: 7F-A9-21-CC","dim",1000],

["Verifying fingerprint...","",3700],

["Fingerprint verified.","blue",2600],


["PAUSE","pause",3500],


/* REFERENCES */

["Scanning temporary references...","",600],

["Reference 01 checked.","dim",300],

["Reference 02 checked.","dim",300],

["Reference 03 checked.","dim",300],

["Reference 04 checked.","dim",600],


["PAUSE","pause",1900],


["No direct access available.","yellow",3100],


/* THIRD SCAN */

["Running extended integrity check...","yellow",1500],

["INTEGRITY ANALYSIS","progress",8000],


["Analyzing process states...","",3600],

["Analyzing response patterns...","",2700],

["Testing security boundaries...","",4000],


["PAUSE","pause",2700],


["Boundary response: RESTRICTED","yellow",3600],


["Compiling diagnostic report...","",1900],

["Encrypting report...","",4300],

["Final validation pending...","red",3100],


["PAUSE","pause",3600],


/* FINAL BUILDUP */

["Starting final security check...","yellow",1900],

["Verifying final state...","",4100],

["PAUSE","pause",2300],

["...","dim",3000],

["Unexpected security response.","yellow",3300],

["PAUSE","pause",1900],

["SECURITY EVENT DETECTED","red",1300],

["SIMULATED ALERT LEVEL: CRITICAL","red",2500]

];


function sleep(ms){

return new Promise(
resolve=>setTimeout(resolve,ms)
);

}


function add(text,cls=""){

const d =
document.createElement("div");

d.className =
"line "+cls;

d.textContent =
"> "+text;

terminal.appendChild(d);


/* Keep screen moving */

while(
terminal.children.length>32
){

terminal.removeChild(
terminal.firstChild
);

}

}


async function typeLine(
text,
cls=""
){

const d =
document.createElement("div");

d.className =
"line "+cls;

terminal.appendChild(d);

let output="> ";


/*
Different typing speeds
*/

let speed;

if(text==="..."){

speed=180;

}
else if(
text.includes("CRITICAL")
){

speed=35;

}
else if(
text.length>35
){

speed=10+
Math.random()*10;

}
else{

speed=18+
Math.random()*18;

}


for(
const character of text
){

output+=character;

d.textContent=
output;

await sleep(speed);

}

}


/*
PROGRESS BAR
*/

async function progress(
label,
totalTime
){

add(
label+
" — START",
"yellow"
);

await sleep(900);


const box =
document.createElement("div");

box.className="barbox";


const bar =
document.createElement("div");

bar.className="bar";


box.appendChild(bar);

terminal.appendChild(box);


let percent=0;


while(percent<100){

let jump;


/*
Irregular progress
*/

if(percent<20){

jump=
Math.floor(
Math.random()*3
)+1;

}
else if(percent<55){

jump=
Math.floor(
Math.random()*7
)+2;

}
else if(percent<75){

jump=
Math.floor(
Math.random()*2
)+1;

}
else{

jump=
Math.floor(
Math.random()*5
)+1;

}


percent=
Math.min(
100,
percent+jump
);


bar.style.width=
percent+"%";


let delay =
100+
Math.random()*280;


/*
Fake hesitation
*/

if(
percent>25 &&
percent<35
){

delay=
650+
Math.random()*900;

}


if(
percent>70 &&
percent<80
){

delay=
900+
Math.random()*1200;

}


await sleep(delay);

}


await sleep(900);


add(
"SCAN COMPLETE.",
"blue"
);


await sleep(1700);

}


/*
MAIN START
*/

async function start(){

/*
Try fullscreen.
Browser may still allow
user controls/exit.
*/

try{

await document
.documentElement
.requestFullscreen();

}
catch(e){}


document.getElementById(
"start"
).style.display="none";


document.getElementById(
"app"
).style.display="block";


/*
Timer
*/

let seconds=0;


setInterval(()=>{

seconds++;


document.getElementById(
"clock"
).textContent=

String(
Math.floor(seconds/60)
).padStart(2,"0")

+":"

+

String(
seconds%60
).padStart(2,"0");

},1000);


/*
Initial suspense
*/

await sleep(1800);


/*
Run all scenes
*/

for(
const scene of scenes
){

const text=scene[0];

const type=scene[1];

const wait=scene[2];


/*
Long silence
*/

if(
type==="pause"
){

await sleep(wait);

continue;

}


/*
Progress bar
*/

if(
type==="progress"
){

await progress(
text,
wait
);

continue;

}


/*
Normal dialogue
*/

await typeLine(
text,
type
);


/*
Variable pause after
every line
*/

await sleep(
wait+
Math.random()*900
);

}


/*
Final alert
*/

await finalAlert();

}


/*
FINAL ALERT
*/

async function finalAlert(){

await sleep(3000);


const warning =
document.getElementById(
"warning"
);

warning.style.display="flex";


let number=5;


const counter =
document.getElementById(
"count"
);


await sleep(1200);


const timer=setInterval(()=>{

number--;

counter.textContent=
number;


if(number<=0){

clearInterval(timer);


warning.classList.add(
"glitch"
);


setTimeout(()=>{

warning.style.display="none";


document.getElementById(
"app"
).style.display="none";


document.getElementById(
"prank"
).style.display="flex";


},900);

}

},1000);

}

</script>

</body>
</html>
