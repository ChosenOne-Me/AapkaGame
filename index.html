<script>
const terminal = document.getElementById("terminal");

const scenes = [

  // OPENING — slow
  {t:"Initializing secure runtime...", c:"", wait:2200},
  {t:"Loading diagnostic modules...", c:"dim", wait:3200},
  {t:"Preparing secure session...", c:"", wait:1400},

  // QUICK BURST
  {t:"Session initialized.", c:"blue", wait:500},
  {t:"Checking environment...", c:"", wait:450},
  {t:"Reading system interfaces...", c:"", wait:500},
  {t:"Interface response: WAITING", c:"yellow", wait:2800},

  // LONG SILENCE
  {pause:3200},

  {t:"Re-attempting interface check...", c:"", wait:900},
  {t:"Response received.", c:"blue", wait:2400},

  // SCAN
  {t:"Beginning deep diagnostic...", c:"yellow", wait:1200},
  {progress:"DEEP SYSTEM SCAN",time:6500},

  // FAST
  {t:"Environment scan started.", c:"", wait:350},
  {t:"Reading runtime...", c:"", wait:350},
  {t:"Checking permissions...", c:"", wait:350},
  {t:"Checking security layer...", c:"", wait:450},
  {t:"Analyzing response...", c:"", wait:700},

  // PAUSE
  {pause:2400},

  {t:"Unexpected response detected.", c:"yellow", wait:3200},

  // SECOND SCAN
  {t:"Running secondary verification...", c:"", wait:1000},
  {progress:"SECURITY VERIFICATION",time:7200},

  {t:"Verification incomplete.", c:"yellow", wait:1800},
  {t:"Attempting fallback protocol...", c:"", wait:2800},
  {t:"Fallback protocol accepted.", c:"blue", wait:1000},

  // FINGERPRINT
  {t:"Generating diagnostic fingerprint...", c:"", wait:1700},
  {t:"Fingerprint: 7F-A9-21-CC", c:"dim", wait:900},
  {t:"Verifying fingerprint...", c:"", wait:3600},
  {t:"Fingerprint verified.", c:"blue", wait:2500},

  // LONG SILENCE
  {pause:3500},

  // RAPID FILE CHECK
  {t:"Scanning temporary references...", c:"", wait:500},
  {t:"Reference 01 checked.", c:"dim", wait:300},
  {t:"Reference 02 checked.", c:"dim", wait:300},
  {t:"Reference 03 checked.", c:"dim", wait:300},
  {t:"Reference 04 checked.", c:"dim", wait:500},

  {pause:1800},

  {t:"No direct access available.", c:"yellow", wait:3000},

  // THIRD SCAN
  {t:"Running extended integrity check...", c:"yellow", wait:1400},
  {progress:"INTEGRITY ANALYSIS",time:8000},

  // SLOW ANALYSIS
  {t:"Analyzing process states...", c:"", wait:3500},
  {t:"Analyzing response patterns...", c:"", wait:2600},
  {t:"Testing security boundaries...", c:"", wait:3900},

  {pause:2600},

  {t:"Boundary response: RESTRICTED", c:"yellow", wait:3500},

  // FINAL BUILDUP
  {t:"Compiling diagnostic report...", c:"", wait:1800},
  {t:"Encrypting report...", c:"", wait:4200},
  {t:"Final validation pending...", c:"red", wait:3000},

  {pause:3500},

  {t:"Starting final security check...", c:"yellow", wait:1800},
  {t:"Verifying final state...", c:"", wait:4000},

  {pause:2200},

  {t:"...", c:"dim", wait:3000},

  {t:"Unexpected security response.", c:"yellow", wait:3200},

  {pause:1800},

  {t:"SECURITY EVENT DETECTED", c:"red", wait:1200},
  {t:"SIMULATED ALERT LEVEL: CRITICAL", c:"red", wait:2500}
];


function sleep(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}


function add(text,cls=""){

  const d=document.createElement("div");

  d.className="line "+cls;

  d.textContent="> "+text;

  terminal.appendChild(d);

  while(terminal.children.length>32){
    terminal.removeChild(terminal.firstChild);
  }

}


async function typeLine(text,cls=""){

  const d=document.createElement("div");

  d.className="line "+cls;

  terminal.appendChild(d);

  let output="> ";

  /*
    Variable typing speed.
    Kuch lines fast,
    kuch deliberately slow.
  */

  let speed;

  if(text==="..."){
    speed=180;
  }
  else if(text.includes("CRITICAL")){
    speed=35;
  }
  else if(text.length>35){
    speed=10+Math.random()*10;
  }
  else{
    speed=18+Math.random()*16;
  }

  for(const char of text){

    output+=char;

    d.textContent=output;

    await sleep(speed);

  }

}


async function progress(label,totalTime){

  add(label+" — START","yellow");

  await sleep(900);

  const box=document.createElement("div");

  box.className="barbox";

  const bar=document.createElement("div");

  bar.className="bar";

  box.appendChild(bar);

  terminal.appendChild(box);

  let percent=0;

  while(percent<100){

    /*
      Uneven progress.
      Kabhi fast,
      kabhi rukega.
    */

    let jump;

    if(percent<20){
      jump=Math.floor(Math.random()*3)+1;
    }
    else if(percent<55){
      jump=Math.floor(Math.random()*7)+2;
    }
    else if(percent<75){
      jump=Math.floor(Math.random()*2)+1;
    }
    else{
      jump=Math.floor(Math.random()*5)+1;
    }

    percent=Math.min(100,percent+jump);

    bar.style.width=percent+"%";

    let delay;

    if(percent>25 && percent<35){
      delay=650+Math.random()*900;
    }
    else if(percent>70 && percent<80){
      delay=900+Math.random()*1200;
    }
    else{
      delay=100+Math.random()*260;
    }

    await sleep(delay);

  }

  await sleep(1000);

  add("SCAN COMPLETE.","blue");

  await sleep(1800);
}


async function finalAlert(){

  await sleep(3000);

  const warning=document.getElementById("warning");

  warning.style.display="flex";

  let number=5;

  const counter=document.getElementById("count");

  counter.textContent=number;

  await sleep(1200);

  const timer=setInterval(()=>{

    number--;

    counter.textContent=number;

    if(number<=0){

      clearInterval(timer);

      warning.classList.add("glitch");

      setTimeout(()=>{

        warning.style.display="none";

        document.getElementById("app").style.display="none";

        document.getElementById("prank").style.display="flex";

      },1000);

    }

  },1000);

}


async function start(){

  try{
    await document.documentElement.requestFullscreen();
  }catch(e){}

  document.getElementById("start").style.display="none";

  document.getElementById("app").style.display="block";


  let seconds=0;

  setInterval(()=>{

    seconds++;

    document.getElementById("clock").textContent =
      String(Math.floor(seconds/60)).padStart(2,"0")
      +":"+
      String(seconds%60).padStart(2,"0");

  },1000);


  /*
    Initial silence
  */

  await sleep(1800);


  for(const scene of scenes){

    /*
      Special silence
    */

    if(scene.pause){

      await sleep(scene.pause);

      continue;

    }


    /*
      Progress bar scene
    */

    if(scene.progress){

      await progress(scene.progress,scene.time);

      continue;

    }


    /*
      Dialogue
    */

    await typeLine(scene.t,scene.c);


    /*
      IMPORTANT:
      Dialogue ke baad random natural pause.
    */

    let naturalPause =
      scene.wait +
      Math.floor(Math.random()*900);

    await sleep(naturalPause);

  }


  await finalAlert();

}

    </script>
