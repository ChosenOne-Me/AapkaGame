<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>System Security</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#020403;
  color:#00ff66;
  font-family:monospace;
  overflow:hidden;
}
#screen{
  height:100vh;
  padding:20px;
  position:relative;
  background:
    radial-gradient(circle at center,#062b12 0,#020403 55%,#000 100%);
}
.scanlines{
  pointer-events:none;
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,255,80,.025) 0px,
    rgba(0,255,80,.025) 1px,
    transparent 1px,
    transparent 4px
  );
  z-index:20;
}
#terminal{
  height:100%;
  overflow:hidden;
  text-shadow:0 0 7px #00ff66;
}
.line{
  margin:6px 0;
  font-size:14px;
}
.dim{opacity:.65}
.warn{color:#ff3333;text-shadow:0 0 8px red}
.yellow{color:#ffe600}
.progress{
  width:100%;
  max-width:600px;
  height:18px;
  border:1px solid #00ff66;
  margin:10px 0;
  box-shadow:0 0 10px #00ff6644;
}
.bar{
  height:100%;
  width:0%;
  background:#00ff66;
  box-shadow:0 0 15px #00ff66;
  transition:width .2s;
}
#alert{
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(50,0,0,.96);
  color:#ff2020;
  text-align:center;
  text-shadow:0 0 20px red;
  animation:flash .35s infinite alternate;
}
#alert h1{
  font-size:clamp(35px,10vw,90px);
  margin:10px;
}
#count{
  font-size:70px;
}
#prank{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#050505;
  color:#00ff66;
  text-align:center;
}
#prank h1{
  font-family:Arial,sans-serif;
  font-size:clamp(42px,12vw,110px);
  margin:10px;
  animation:pop .7s ease-out;
  text-shadow:0 0 25px #00ff66;
}
#prank p{
  font-family:Arial,sans-serif;
  color:white;
  font-size:20px;
}
button{
  padding:12px 25px;
  background:#00ff66;
  color:#000;
  border:0;
  font-weight:bold;
  border-radius:5px;
  cursor:pointer;
}
@keyframes flash{
  from{opacity:.75}
  to{opacity:1}
}
@keyframes pop{
  0%{transform:scale(.1);opacity:0}
  70%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}
.glitch{
  animation:glitch .12s infinite;
}
@keyframes glitch{
  0%{transform:translate(0)}
  25%{transform:translate(4px,-2px)}
  50%{transform:translate(-4px,2px)}
  75%{transform:translate(2px,1px)}
  100%{transform:translate(0)}
}
</style>
</head>

<body>

<div id="screen">
  <div id="terminal"></div>
</div>

<div class="scanlines"></div>

<div id="alert">
  <div>⚠ SECURITY BREACH ⚠</div>
  <h1>CRITICAL ALERT</h1>
  <div>UNAUTHORIZED ACCESS DETECTED</div>
  <div id="count">5</div>
</div>

<div id="prank">
  <h1>😂 PRANK HO GYA</h1>
  <p>Relax... kuch hack nahi hua 😎</p>
  <button onclick="location.reload()">RUN AGAIN</button>
</div>

<script>
const terminal=document.getElementById("terminal");

const messages=[
 "BOOTING SECURITY PROTOCOL...",
 "Initializing encrypted environment...",
 "Loading security modules...",
 "Establishing secure connection...",
 "Connection established.",
 "Scanning available network nodes...",
 "Searching for active devices...",
 "Device detected...",
 "Analyzing system architecture...",
 "Checking security permissions...",
 "Bypassing simulated firewall...",
 "Firewall response: DENIED",
 "Attempting secondary protocol...",
 "Protocol accepted.",
 "Scanning system directories...",
 "Searching user files...",
 "Scanning temporary storage...",
 "Analyzing system logs...",
 "Checking access privileges...",
 "Privilege level: ELEVATED",
 "Encrypting simulated connection...",
 "Preparing final security check..."
];

let i=0;

function add(text,cls=""){
  const d=document.createElement("div");
  d.className="line "+cls;
  d.textContent="> "+text;
  terminal.appendChild(d);
  terminal.scrollTop=terminal.scrollHeight;
}

function typeMessages(){
  if(i<messages.length){
    add(messages[i]);
    i++;

    let delay=700+Math.random()*500;

    if(i===7) delay=1200;
    if(i===13) delay=1400;
    if(i===18) delay=1000;

    setTimeout(typeMessages,delay);
  }else{
    progress();
  }
}

function progress(){
  add("SYSTEM SCAN IN PROGRESS...","yellow");

  const box=document.createElement("div");
  box.className="progress";

  const bar=document.createElement("div");
  bar.className="bar";

  box.appendChild(bar);
  terminal.appendChild(box);

  let p=0;

  const timer=setInterval(()=>{
    p+=Math.floor(Math.random()*7)+2;
    if(p>100)p=100;

    bar.style.width=p+"%";

    if(p===100){
      clearInterval(timer);

      setTimeout(()=>{
        add("SCAN COMPLETE.");
        add("MULTIPLE SECURITY EVENTS DETECTED.","warn");
      },800);

      setTimeout(showAlert,2500);
    }
  },300);
}

function showAlert(){
  const alert=document.getElementById("alert");
  alert.style.display="flex";

  let n=5;
  const count=document.getElementById("count");

  const timer=setInterval(()=>{
    n--;
    count.textContent=n;

    if(n<=0){
      clearInterval(timer);
      setTimeout(showPrank,700);
    }
  },900);
}

function showPrank(){
  document.getElementById("alert").style.display="none";
  document.getElementById("screen").classList.add("glitch");

  setTimeout(()=>{
    document.getElementById("screen").style.display="none";
    document.getElementById("prank").style.display="flex";
  },500);
}

/* Start */
setTimeout(typeMessages,1000);
</script>

</body>
</html>
