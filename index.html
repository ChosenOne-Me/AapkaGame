<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Diagnostic</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:#000;
color:#00ff66;
font-family:monospace;
overflow:hidden
}

#start{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
z-index:10
}

#start h1{
font-size:clamp(30px,8vw,60px);
text-shadow:0 0 20px #00ff66
}

button{
background:#001b09;
color:#00ff66;
border:1px solid #00ff66;
padding:14px 25px;
font:bold 16px monospace;
cursor:pointer
}

#app{
display:none;
height:100vh;
padding:12px;
background:
radial-gradient(circle,#063515,#010601 60%,#000)
}

.top{
height:40px;
border-bottom:1px solid #00ff6644;
display:flex;
justify-content:space-between;
align-items:center;
font-size:12px
}

.dot{
display:inline-block;
width:8px;
height:8px;
background:#00ff66;
border-radius:50%;
box-shadow:0 0 10px #00ff66;
margin-right:7px
}

#terminal{
height:calc(100vh - 65px);
overflow:hidden;
padding-top:10px
}

.line{
font-size:clamp(11px,2.7vw,15px);
line-height:1.55;
white-space:nowrap;
text-shadow:0 0 6px #00ff66
}

.dim{opacity:.5}

.blue{
color:#00c8ff;
text-shadow:0 0 8px #00c8ff
}

.yellow{
color:#ffe600;
text-shadow:0 0 8px #ffe600
}

.red{
color:#ff3030;
text-shadow:0 0 10px red
}

.barbox{
width:95%;
height:15px;
border:1px solid #00ff66;
margin:5px 0 8px
}

.bar{
height:100%;
width:0;
background:#00ff66;
box-shadow:0 0 12px #00ff66
}

#warning{
display:none;
position:fixed;
inset:0;
z-index:20;
background:#320000;
color:red;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center
}

#warning h1{
font:bold clamp(45px,13vw,100px) Arial;
margin:15px;
text-shadow:0 0 30px red
}

#count{
font:bold 75px Arial
}

#prank{
display:none;
position:fixed;
inset:0;
z-index:30;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
background:#000
}

#prank img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.7)
}

.overlay{
position:absolute;
inset:0;
background:#0004
}

.reveal{
position:relative;
z-index:2
}

.reveal h1{
font:bold clamp(42px,13vw,100px) Arial;
color:white;
text-shadow:0 0 20px #000,0 0 35px #00ff66;
animation:pop .7s
}

.reveal p{
font:bold 18px Arial;
color:white;
text-shadow:0 2px 8px #000
}

@keyframes pop{
0%{transform:scale(.1);opacity:0}
70%{transform:scale(1.1)}
100%{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div id="start">
<h1>SYSTEM DIAGNOSTIC</h1>
<p>SECURE TERMINAL</p>
<button onclick="start()">INITIALIZE</button>
</div>


<div id="app">

<div class="top">
<span>
<i class="dot"></i>
SECURE TERMINAL
</span>

<span id="clock">00:00</span>
</div>

<div id="terminal"></div>

</div>


<div id="warning">

<div>⚠ SYSTEM SECURITY EVENT ⚠</div>

<h1>CRITICAL</h1>

<div>FINAL VERIFICATION REQUIRED</div>

<div id="count">5</div>

</div>


<div id="prank">

<!-- Apni image ka naam prank.jpg rakho -->
<img src="prank.jpg">

<div class="overlay"></div>

<div class="reveal">

<h1>😂 PRANK HO GYA</h1>

<p>Relax 😎 — kuch hack nahi hua.</p>

<button onclick="location.reload()">
RUN AGAIN
</button>

</div>

</div>


<script>

const terminal=
document.getElementById("terminal");


/*
FAST CINEMATIC TIMELINE
TOTAL ≈ 20–25 SEC
*/

const scenes=[

["Initializing secure runtime...","",650],

["Loading diagnostic modules...","dim",700],

["Preparing secure session...","",500],

["Session initialized.","blue",450],

["Checking environment...","",350],

["Reading system interfaces...","",400],

["Interface response: WAITING","yellow",1200],


/* SHORT PAUSE */

["PAUSE","pause",1000],


["Re-attempting interface check...","",550],

["Response received.","blue",650],


/* SCAN */

["Beginning deep diagnostic...","yellow",650],

["DEEP SYSTEM SCAN","progress",2600],


/* FAST BURST */

["Checking permissions...","",350],

["Reading runtime...","",350],

["Checking security layer...","",400],

["Analyzing response...","",500],

["Security response: RESTRICTED","yellow",900],


/* PAUSE */

["PAUSE","pause",1100],


/* SECOND SCAN */

["Running secondary verification...","",600],

["SECURITY VERIFICATION","progress",2500],


["Verification incomplete.","yellow",800],

["Attempting fallback protocol...","",750],

["Fallback protocol accepted.","blue",650],


/* FINGERPRINT */

["Generating diagnostic fingerprint...","",650],

["Fingerprint: 7F-A9-21-CC","dim",500],

["Verifying fingerprint...","",1100],

["Fingerprint verified.","blue",700],


/* FAST REFERENCES */

["Scanning temporary references...","",450],

["Reference 01 checked.","dim",250],

["Reference 02 checked.","dim",250],

["Reference 03 checked.","dim",350],


["No direct access available.","yellow",900],


/* FINAL CHECK */

["Running final integrity check...","yellow",700],

["INTEGRITY ANALYSIS","progress",2600],

["Boundary response: RESTRICTED","yellow",900],

["Compiling report...","",650],

["Encrypting report...","",1000],

["Final validation pending...","red",900],


/* FINAL PAUSE */

["PAUSE","pause",1000],


["Unexpected security response.","yellow",1100],

["SECURITY EVENT DETECTED","red",650],


/* FAKE DEMO BANK ALERT */

["⚠ DEMO BANK ALERT ⚠","red",700],

["ACCOUNT SECURITY CHECK","yellow",700],

["REMAINING BALANCE: ₹6.90","red",1200],

["VERIFICATION REQUIRED","yellow",900]

];


function sleep(ms){

return new Promise(
resolve=>setTimeout(resolve,ms)
);

}


function add(text,cls=""){

const d=
document.createElement("div");

d.className="line "+cls;

d.textContent="> "+text;

terminal.appendChild(d);


while(
terminal.children.length>28
){

terminal.removeChild(
terminal.firstChild
);

}

}


async function typeLine(text,cls=""){

const d=
document.createElement("div");

d.className="line "+cls;

terminal.appendChild(d);

let out="> ";

let speed=
text.length>30
?7
:11;


for(
const ch of text
){

out+=ch;

d.textContent=out;

await sleep(speed);

}

}


/* PROGRESS BAR */

async function progress(label,time){

add(
label+" — START",
"yellow"
);

await sleep(250);


const box=
document.createElement("div");

box.className="barbox";


const bar=
document.createElement("div");

bar.className="bar";


box.appendChild(bar);

terminal.appendChild(box);


let p=0;

const startTime=Date.now();


while(p<100){

p+=
Math.floor(
Math.random()*9
)+3;

if(p>100)p=100;

bar.style.width=p+"%";


let delay=80+
Math.random()*130;


/* tiny fake pauses */

if(p>35 && p<45)
delay=250;

if(p>75 && p<82)
delay=400;


await sleep(delay);

}


await sleep(300);

add(
"SCAN COMPLETE.",
"blue"
);

await sleep(400);

}


/* START */

async function start(){

try{

await document
.documentElement
.requestFullscreen();

}catch(e){}


document.getElementById(
"start"
).style.display="none";


document.getElementById(
"app"
).style.display="block";


/* CLOCK */

let seconds=0;

setInterval(()=>{

seconds++;

document.getElementById(
"clock"
).textContent=

String(
Math.floor(seconds/60)
).padStart(2,"0")
+
":"
+
String(
seconds%60
).padStart(2,"0");

},1000);


/* INITIAL DELAY */

await sleep(600);


/* RUN */

for(
const scene of scenes
){

const text=scene[0];

const type=scene[1];

const wait=scene[2];


/* PAUSE */

if(type==="pause"){

await sleep(wait);

continue;

}


/* PROGRESS */

if(type==="progress"){

await progress(text,wait);

continue;

}


/* NORMAL LINE */

await typeLine(
text,
type
);


/* VARIABLE PAUSE */

await sleep(
wait+
Math.random()*250
);

}


/* FINAL ALERT */

await finalAlert();

}


/* FINAL ALERT */

async function finalAlert(){

await sleep(900);


const warning=
document.getElementById(
"warning"
);

warning.style.display="flex";


let n=5;

const count=
document.getElementById(
"count"
);

count.textContent=n;


const timer=setInterval(()=>{

n--;

count.textContent=n;


if(n<=0){

clearInterval(timer);


setTimeout(()=>{

warning.style.display="none";

document.getElementById(
"app"
).style.display="none";

document.getElementById(
"prank"
).style.display="flex";

},500);

}

},800);

}

</script>

</body>
</html>
